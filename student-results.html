<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Results</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Student Results</h1>
        
        <div class="main-content">
            <div class="form-container">
                <h2>Add student</h2>
                <form>
                    <label for="studentName">Name</label>
                    <input type="text" id="studentName" name="studentName" placeholder="Student name" required>
                    
                    <label for="marks">Marks</label>
                    <input type="number" id="marks" name="marks" placeholder="0 to 100" required>
                    
                    <button type="button" id="addButton">Add student</button>
                </form>
            </div>
            
            <div id="resultsContainer">
                <div class="results-header">
                    <h2>Student list</h2>
                    <button type="button" id="showPassedButton">Show passed</button>
                </div>
                <div class="results-info" id="resultsInfo"></div>
                <ul id="resultsList"></ul>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
